<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PONDI — Two Cultures. One Identity.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1F5F6B; --teal-deep:#164751; --terracotta:#B85C3D;
  --gold:#F4B942; --sand:#C9A77A; --cream:#F5F0E8; --paper:#F7F1E4;
  --ink:#1B4650;
  --body:"EB Garamond",Georgia,serif;
  --util:"Jost","Century Gothic",sans-serif;
  --gut:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}          /* one screen, no scrolling */
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:clamp(16px,1.05vw,19px);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:4px}

/* ---------------- nav ---------------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--gut);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .bl{width:32px;height:32px}
.brand .bw{height:19px;width:auto}
.links{display:flex;align-items:center;gap:clamp(16px,2.2vw,34px)}
.links a{
  font-family:var(--util);font-size:12px;font-weight:400;letter-spacing:.19em;
  text-transform:uppercase;color:var(--teal);position:relative;padding-bottom:3px;
}
.links a::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--terracotta);
  transform:scaleX(0);transform-origin:right;transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.links a:hover::after{transform:scaleX(1);transform-origin:left}
.burger{background:none;border:0;cursor:pointer;padding:8px;width:38px}
.burger i{display:block;height:1.5px;background:var(--teal);margin:5px 0;transition:transform .35s,opacity .3s}
.nav.open .burger i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav.open .burger i:nth-child(2){opacity:0}
.nav.open .burger i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.sheet{
  position:fixed;inset:0 0 auto 0;z-index:55;background:rgba(247,241,228,.99);
  padding:96px var(--gut) 34px;display:flex;flex-direction:column;gap:20px;
  transform:translateY(-102%);transition:transform .55s cubic-bezier(.22,1,.36,1);
  box-shadow:0 16px 40px rgba(27,70,80,.12);
}
.nav.open ~ .sheet{transform:none}
.sheet a{font-family:var(--util);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal)}
/* the bottom-anchored cover crop puts the facades behind the bar, so it takes
   the cream treatment at rest and the tabs stay readable */
@media (min-width:761px){
  .nav{
    background:rgba(247,241,228,.94);backdrop-filter:blur(8px);
    box-shadow:0 1px 0 rgba(201,167,122,.6);
  }
}

  overflow:hidden;isolation:isolate;
}

/* the canal is displaced in a shader drawn straight onto the plate */
.river-gl{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.birds{position:absolute;top:16%;left:0;width:100%;z-index:2;opacity:.42;pointer-events:none}
.bird{animation:fly 52s linear infinite}
.bird:nth-child(2){animation-duration:68s;animation-delay:-18s}
.bird:nth-child(3){animation-duration:60s;animation-delay:-36s}
@keyframes fly{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}

/* everything below is sized against viewport height as well as width, so the
   whole composition — button included — always lands inside one screen */
.hero-in{
  position:relative;z-index:3;text-align:center;width:100%;max-width:620px;
  padding:calc(64px + 2vh) 22px 21vh;
}
.hero-logo{width:clamp(72px,13.5vh,152px);margin:0 auto clamp(8px,1.4vh,14px)}
.hero-word{width:min(64vw,47vh,382px);margin:0 auto}
.tagline{
  font-family:var(--body);font-weight:500;color:var(--terracotta);
  font-size:clamp(15px,2.6vh,28px);letter-spacing:.13em;text-transform:uppercase;
  margin:clamp(10px,2vh,20px) 0 0;line-height:1.42;
}
.divider{
  display:flex;align-items:center;justify-content:center;gap:12px;color:var(--sand);
  margin:clamp(12px,2.4vh,22px) 0;
}
.divider::before,.divider::after{content:"";height:1px;width:clamp(40px,7vw,88px);background:currentColor}
.lede{
  max-width:26ch;margin:0 auto clamp(16px,3vh,30px);color:#3F5D62;
  font-size:clamp(14px,2vh,19px);line-height:1.6;
}
.cta{
  display:inline-flex;align-items:center;gap:12px;background:var(--teal);color:#F7F1E4;
  font-family:var(--util);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  padding:15px 30px;border-radius:6px 20px 6px 20px;
  box-shadow:0 8px 22px rgba(27,70,80,.22);
  transition:background .45s,transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s;
}
.cta:hover{background:var(--terracotta);transform:translateY(-2px);box-shadow:0 12px 28px rgba(184,92,61,.3)}
.cta svg{transition:transform .45s cubic-bezier(.22,1,.36,1)}
.cta:hover svg{transform:translateX(4px)}

.lift{opacity:0;transform:translateY(28px);animation:lift 1.4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes lift{to{opacity:1;transform:none}}

/* ---------------- responsive ---------------- */
@media (max-width:980px){ .links{display:none} }
@media (min-width:981px){ .burger{display:none} .sheet{display:none} }
@media (max-width:760px){
  .hero-img{background-size:auto 58vh;background-position:50% 100%}
  .hero{background:linear-gradient(180deg,#FAF5EA 0%,#F7F1E4 46%)}
  .hero-in{padding:calc(60px + 2vh) 20px 24vh}
}
@media (max-width:430px){ .tagline{letter-spacing:.1em} }
@media (max-height:700px){
  .hero-in{padding:calc(58px + 1vh) 22px 15vh}
  .hero-logo{width:clamp(56px,11vh,90px)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .lift{opacity:1;transform:none}
  .hero-img{transform:none}
}

<script>
/* Slow canal flow.
   Draws the hero plate into a canvas that sits inside .hero-img (so it inherits
   the same transform, parallax and breathe), then displaces only the texels
   inside the canal. Geometry below was measured off the plate: the canal's
   vanishing point is at v=0.689,u=0.488 and its banks reach u=0.198/0.811 at
   the bottom edge, so the mask follows the artwork's real perspective.
   Motion is a sum of three sines with incommensurate periods (~63s, ~101s,
   ~153s) driven by elapsed time, so it never repeats and cannot seam. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var host = document.querySelector('.hero-img');
  if (!host) return;

  var m = getComputedStyle(host).backgroundImage.match(/url\(["']?(data:[^"')]+)["']?\)/);
  if (!m) return;

  var cv = document.createElement('canvas');
  cv.className = 'river-gl';
  cv.setAttribute('aria-hidden', 'true');
  var gl = cv.getContext('webgl', {alpha:true, antialias:false, depth:false, premultipliedAlpha:true});
  if (!gl) return;                                   // static plate stays as-is

  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var FS = [
  'precision mediump float;',
  'uniform sampler2D tex;',
  'uniform vec2 res, off, siz;',
  'uniform float t;',
  'const float AV=0.689, AU=0.488, LB=0.198, RB=0.811;',
  'void main(){',
  '  vec2 f = vec2(gl_FragCoord.x, res.y-gl_FragCoord.y);',
  '  vec2 uv = (f-off)/siz;',
  '  if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){gl_FragColor=vec4(0.);return;}',
  '  float d = (uv.y-AV)/(1.0-AV);',                 // 0 at horizon, 1 at bottom
  '  vec4 base = texture2D(tex,uv);',
  '  if(d<=0.0){gl_FragColor=base;return;}',
  '  float k = max(d,0.10);',
  '  float b = pow(d,1.25);',
  '  float l = mix(AU,LB,b)+0.004, r = mix(AU,RB,b)-0.006;',
  '  float edge = 0.012*k;',
  '  float mask = smoothstep(l, l+edge, uv.x) * (1.0-smoothstep(r-edge, r, uv.x));',
  '  mask *= smoothstep(0.0,0.22,d);',               // fade in below the horizon
  '  mask *= 1.0-smoothstep(0.986,0.995,uv.y);',     // keep off the plate border
  '  if(mask<=0.001){gl_FragColor=base;return;}',
  '  float z  = 1.0/k;',                             // perspective depth
  '  float uu = (uv.x-AU)/k;',                       // lateral, converging
  '  float w = 0.55*sin(z*2.2 + uu*1.6 - t*0.100)',
  '          + 0.30*sin(z*3.7 - uu*2.9 - t*0.062)',
  '          + 0.15*sin(z*6.1 + uu*4.3 - t*0.041);',
  '  float amp = 0.0034*pow(d,1.6)*mask;',
  '  vec2 q = uv + vec2(w*amp*0.45, w*amp);',
  '  vec4 c = texture2D(tex,q);',
  '  c.rgb *= 1.0 + 0.030*w*mask;',                  // reflections breathe
  '  gl_FragColor = vec4(c.rgb,1.0);',
  '}'].join('\n');

  function sh(type, src){
    var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null;
  }
  var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  var pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(pr,'res'), uOff = gl.getUniformLocation(pr,'off'),
      uSiz = gl.getUniformLocation(pr,'siz'), uT = gl.getUniformLocation(pr,'t');

  var IW = 1024, IH = 850, ready = false, W = 0, H = 0, dpr = 1;

  var img = new Image();
  img.onload = function(){
    var tx = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    IW = img.naturalWidth; IH = img.naturalHeight;
    ready = true;
    host.appendChild(cv);
    resize();
  };
  img.src = m[1];

  /* mirror the CSS background sizing exactly, both branches */
  function resize(){
    if (!ready) return;
    W = host.clientWidth; H = host.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    gl.viewport(0, 0, cv.width, cv.height);

    var dw, dh;
    if (window.matchMedia('(max-width:760px)').matches){
      dh = 0.62 * window.innerHeight;                // background-size:auto 62vh
      dw = dh * (IW/IH);
    } else {
      var sc = Math.max(W/IW, H/IH);                 // background-size:cover
      dw = IW*sc; dh = IH*sc;
    }
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform2f(uSiz, dw*dpr, dh*dpr);
    gl.uniform2f(uOff, ((W-dw)/2)*dpr, (H-dh)*dpr);  // background-position:50% 100%
  }

  var visible = true;
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(e){ visible = e[0].isIntersecting; })
      .observe(document.querySelector('.hero'));
  }

  var t0 = performance.now(), last = 0;
  function loop(now){
    requestAnimationFrame(loop);
    if (!ready || !visible) return;
    if (now - last < 33) return;                     // 30fps is ample here
    last = now;
    gl.uniform1f(uT, (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(loop);

  var rt;
  addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize, 120); });
})();
</script>
</body>
</html>
